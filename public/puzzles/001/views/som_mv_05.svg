<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768" style="pointer-events:none;">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Bounding Reticles -->
  <rect x="768" y="0" width="256" height="192" fill="none" stroke="#C026D3" stroke-width="2" rx="2" />
  <rect x="768" y="0" width="256" height="192" fill="none" stroke="#C026D3" stroke-width="2" rx="2" />
  <rect x="256" y="192" width="256" height="192" fill="none" stroke="#C026D3" stroke-width="2" rx="2" />
  <!-- Set-of-Mark Badges -->
  <g class="som-badge" data-som-id="#11">
    <rect x="766" y="2" width="28" height="18" fill="#C026D3" stroke="#FFFFFF" stroke-width="1" rx="2" filter="url(#drop-shadow)" />
    <text x="780" y="15" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12" font-weight="bold" text-anchor="middle">#11</text>
  </g>
  <g class="som-badge" data-som-id="#12">
    <rect x="766" y="2" width="28" height="18" fill="#C026D3" stroke="#FFFFFF" stroke-width="1" rx="2" filter="url(#drop-shadow)" />
    <text x="780" y="15" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12" font-weight="bold" text-anchor="middle">#12</text>
  </g>
  <g class="som-badge" data-som-id="#90">
    <rect x="506" y="184" width="28" height="18" fill="#C026D3" stroke="#FFFFFF" stroke-width="1" rx="2" filter="url(#drop-shadow)" />
    <text x="520" y="197" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12" font-weight="bold" text-anchor="middle">#90</text>
  </g>
</svg>